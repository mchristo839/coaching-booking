name: Deploy Production (Vercel)

# Auto-deploys main to the live Vercel project on every push.
#
# Why this exists instead of Vercel's native Git integration:
# the project lives on a FREE Hobby account (mario-8407) whose owner differs
# from the GitHub commit author (mchristo839). Hobby blocks Git-triggered
# production deploys when author != account owner ("commit email could not be
# matched to a GitHub account"). A token-based CLI deploy is attributed to the
# token's owner (mario-8407 = the project owner), so it sidesteps that block.
#
# Required GitHub repo secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN       - a token created on the mario-8407 account, scoped to
#                        the "Mario's projects" team (marios-projects-d32e3019)
#   VERCEL_ORG_ID      - orgId from `.vercel/project.json` after `vercel link`
#   VERCEL_PROJECT_ID  - projectId from `.vercel/project.json`
#
# After this is live, DISCONNECT Vercel's native Git integration on the
# coaching-booking-v3 project (Settings > Git) so it stops creating duplicate
# "Blocked" deployments on every push.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping prod deploys; cancel an in-flight run if a newer push lands.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings & env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
